services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aipal
      POSTGRES_PASSWORD: aipal_dev
      POSTGRES_DB: aipal
    ports:
      - "5433:5432"
    volumes:
      - aipal_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - aipal_redis:/data

volumes:
  aipal_pg:
  aipal_redis:
